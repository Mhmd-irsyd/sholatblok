name: sholatblok
description: "Aplikasi pengingat sholat dengan notifikasi tepat waktu dan suara adzan kustom."
publish_to: 'none'

version: 1.0.11+12

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Kalkulasi Waktu Sholat (Offline Astronomis) ──
  adhan: ^2.0.0

  # ── Lokasi & GPS ──
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # ── Notifikasi & Alarm ──
  flutter_local_notifications: ^18.0.1
  android_alarm_manager_plus: ^4.0.7
  permission_handler: ^11.4.0
  timezone: ^0.10.1

  # ── Audio Player (Custom Adzan) ──
  just_audio: ^0.9.46
  audio_session: ^0.1.21

  # ── File Picker (Pilih MP3 dari HP) ──
  file_picker: ^8.1.7

  # ── Penyimpanan Lokal ──
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # ── State Management ──
  flutter_riverpod: ^2.6.1

  # ── Utilitas Tanggal Hijriyah ──
  hijri: ^3.0.0

  # ── UI Helpers ──
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
